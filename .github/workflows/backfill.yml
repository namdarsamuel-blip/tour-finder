name: Backfill history

# Run once by hand: Actions -> Backfill history -> Run workflow.
# Pulls archived copies of the Spotify listener pages (Internet Archive) from
# ~1 week to 4 months ago so long-range growth works right away.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill listener history from the Internet Archive
        run: python backfill.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
