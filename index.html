<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5eff'/%3E%3Cpath d='M9 11h14v3a2 2 0 0 0 0 4v3H9v-3a2 2 0 0 0 0-4z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#17171a; --muted:#6b6b73; --line:#e4e2dc; --soft:#f0eee9;
  --accent:#1f5eff; --accent-ink:#ffffff; --accent-soft:#e6edff;
  --now:#0f8a4b; --now-bg:#e3f5ea; --soon:#9a6400; --soon-bg:#fdf1d8;
  --sg:#2b5fa8; --sg-bg:#e4eefb; --off:#8a8a92; --off-bg:#efefef;
  --new:#b4237a; --new-bg:#fbe4f1; --mine:#6b3fd1; --mine-bg:#eee7fd;
  --up:#0f8a4b; --down:#c43c3c; --hot:#e0482b; --hot-bg:#fde6e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --panel:#1b1b1f; --ink:#ececf0; --muted:#9a9aa3; --line:#2c2c33; --soft:#232328;
    --accent:#6f94ff; --accent-ink:#0b0b0d; --accent-soft:#1d2645;
    --now:#5fd394; --now-bg:#163323; --soon:#f0b85a; --soon-bg:#3a2c12;
    --sg:#8db4ef; --sg-bg:#172a45; --off:#8a8a92; --off-bg:#26262b;
    --new:#f28ac6; --new-bg:#3b1630; --mine:#b9a1ff; --mine-bg:#2a2045;
    --up:#5fd394; --down:#f07a7a; --hot:#ff8a6a; --hot-bg:#3d1d15;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --panel:#1b1b1f; --ink:#ececf0; --muted:#9a9aa3; --line:#2c2c33; --soft:#232328;
  --accent:#6f94ff; --accent-ink:#0b0b0d; --accent-soft:#1d2645;
  --now:#5fd394; --now-bg:#163323; --soon:#f0b85a; --soon-bg:#3a2c12;
  --sg:#8db4ef; --sg-bg:#172a45; --off:#8a8a92; --off-bg:#26262b;
  --new:#f28ac6; --new-bg:#3b1630; --mine:#b9a1ff; --mine-bg:#2a2045;
  --up:#5fd394; --down:#f07a7a; --hot:#ff8a6a; --hot-bg:#3d1d15;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* login */
.login{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 18px;color:var(--muted);font-size:14px}
.login label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.login .btn{width:100%;margin-top:18px;padding:11px}
.err{color:var(--down);font-size:13px;margin-top:10px;min-height:1em}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .actions{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.bar + .bar{margin-top:8px}
.bar input[type=search],.bar input[type=number],.bar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.bar input[type=search]{flex:1;min-width:170px}
.bar input[type=number]{width:78px}
.bar label{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.bar .lab{font-size:13px;color:var(--muted)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preset{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:14px;text-align:left}
.preset small{display:block;font-size:11px;color:var(--muted)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.chip{border:1px solid var(--line);background:var(--bg);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.plain{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500}
.count{font-size:13px;color:var(--muted);margin:10px 2px}
.list{display:flex;flex-direction:column;gap:8px}
.group-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 6px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.more{margin:10px auto;display:block}

.badge{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;display:inline-block}
.b-now{color:var(--now);background:var(--now-bg)}
.b-soon{color:var(--soon);background:var(--soon-bg)}
.b-sg{color:var(--sg);background:var(--sg-bg)}
.b-on{color:var(--ink);background:var(--off-bg)}
.b-off{color:var(--off);background:var(--off-bg)}
.b-new{color:var(--new);background:var(--new-bg)}
.b-mine{color:var(--mine);background:var(--mine-bg)}
.b-hot{color:var(--hot);background:var(--hot-bg)}
.up{color:var(--up)} .down{color:var(--down)}
.small{font-size:12px;color:var(--muted)}

/* artist rows */
.arow{display:grid;grid-template-columns:34px minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.3fr) 64px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.arow:hover{border-color:var(--accent)}
.arow > span:not(.ring){display:block;min-width:0}
.asub,.aname{display:block}
.arow .idx{color:var(--muted);font-size:13px;text-align:right}
.aname{font-weight:700;font-size:16px}
.aname .badge{margin-left:4px;vertical-align:2px}
.aname .star{color:var(--mine)}
.asub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:18px;font-weight:700}
.gl{font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.tourline{font-size:13px}
.tourline .small{display:block}
.ring{--v:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--v)*1%), var(--line) 0);justify-self:end}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.ring.hot{background:conic-gradient(var(--hot) calc(var(--v)*1%), var(--line) 0)}

/* show cards */
.show{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.show.skip{opacity:.5}
.show-main{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .m{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.date .d{font-size:24px;font-weight:700;line-height:1.1}
.date .w{font-size:12px;color:var(--muted)}
.who{font-weight:700;font-size:16px}
.who button{all:unset;cursor:pointer}
.who button:hover{text-decoration:underline}
.who .rk{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.where{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.notepeek{font-size:13px;margin-top:6px;padding:6px 9px;background:var(--soft);border-radius:8px;white-space:pre-wrap}
.links{display:flex;flex-direction:column;gap:6px;min-width:128px}
.links a,.links button{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:13px;padding:8px 12px;border-radius:8px}
.links a{cursor:grab}
.links a.tm{background:var(--accent);color:var(--accent-ink)}
.links a.sg{border:1px solid var(--line);color:var(--ink)}
.links button{border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.links button.has{border-style:solid;color:var(--mine)}
.editor{border-top:1px solid var(--line);padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.pill.on{background:var(--mine);border-color:var(--mine);color:#fff}
.editor textarea,.drawer textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.saved{font-size:12px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:31;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding:20px 20px 60px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{margin:0;font-size:26px;letter-spacing:-.01em}
.dlinks{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px;font-size:14px}
.dlinks a{text-decoration:none;font-weight:600}
.close{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sbox b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sbox span{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.parts{display:grid;grid-template-columns:80px 1fr 34px;gap:6px 10px;align-items:center;font-size:13px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chart-svg{width:100%;height:170px;display:block}
.crow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.crow:last-child{border-bottom:0}

/* tables */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td a{text-decoration:none;font-weight:600}
td button.alink{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
td.num,th.num{text-align:right}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.help{font-size:12px;color:var(--muted);margin:6px 2px 0}

@media (max-width:820px){
  .arow{grid-template-columns:minmax(0,1fr) 56px;gap:8px 12px}
  .arow .idx{display:none}
  .arow .c-l,.arow .c-t{grid-column:1/2}
  .arow .ring{grid-row:1/2;grid-column:2/3}
}
@media (max-width:640px){
  .presets{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 8px;padding:0 16px 4px;scrollbar-width:none}
  .preset{flex:0 0 auto}
  .stats{grid-template-columns:1fr 1fr}
  .show-main{grid-template-columns:60px minmax(0,1fr) auto}
  .show-main .links{grid-column:1/-1;flex-direction:row}
  .links a,.links button{flex:1}
  .date .d{font-size:20px}
  .drawer{padding:16px 14px 60px}
}
</style>
</head>
<body>
<div class="wrap">

  <section id="v-setup" hidden>
    <div class="login"><h1>Almost there</h1><p>Paste your Supabase URL and key into <code>docs/config.js</code>.</p></div>
  </section>

  <section id="v-login" hidden>
    <form class="login" id="loginForm">
      <h1>Tour Finder</h1>
      <p>Sign in to see artists, shows and your notes.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <section id="v-app" hidden>
    <div class="top">
      <div>
        <h1>Tour Finder</h1>
        <p id="sub">Loading…</p>
      </div>
      <div class="actions">
        <button class="btn plain" id="reload">Reload</button>
        <button class="btn plain" id="signout">Sign out</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="tab on" data-tab="discover">Discover artists</button>
      <button class="tab" data-tab="shows">U.S. shows</button>
      <button class="tab" data-tab="mine">My list <span class="n" id="mineN"></span></button>
      <button class="tab" data-tab="charts">Spotify charts</button>
    </div>

    <!-- DISCOVER -->
    <div id="t-discover">
      <div class="presets" id="presets"></div>
      <div class="bar">
        <input id="aq" type="search" placeholder="Search any artist…">
        <span class="lab">Listeners</span>
        <input id="lmin" type="number" min="0" step="0.5" placeholder="min M" aria-label="Minimum monthly listeners in millions">
        <span class="lab">to</span>
        <input id="lmax" type="number" min="0" step="0.5" placeholder="max M" aria-label="Maximum monthly listeners in millions">
        <select id="asort" aria-label="Sort artists">
          <option value="draw_score">Sort: Draw score</option>
          <option value="listeners">Monthly listeners</option>
          <option value="growth_signal">Growth rate (%)</option>
          <option value="growth_30d">Growth 30 days (#)</option>
          <option value="pct_7d">Growth 7 days (%)</option>
          <option value="listeners_daily">Daily change (#)</option>
          <option value="max_heat">Hottest show</option>
          <option value="next_show_date">Next show (soonest)</option>
          <option value="us_daily_best">U.S. chart position</option>
          <option value="first_charted">Newest on charts</option>
        </select>
      </div>
      <div class="bar">
        <label><input type="checkbox" id="fTour"> On tour (U.S.)</label>
        <label><input type="checkbox" id="fCharts"> On a chart now</label>
        <label><input type="checkbox" id="fRising"> Rising</label>
        <label><input type="checkbox" id="fPresale"> Presale open</label>
        <select id="fWhen" aria-label="Next show within">
          <option value="">Any show date</option>
          <option value="7">Next show within 7 days</option>
          <option value="30">Within 30 days</option>
          <option value="90">Within 90 days</option>
        </select>
        <select id="fNew" aria-label="New on charts">
          <option value="">Any chart history</option>
          <option value="7">First charted in last 7 days</option>
          <option value="30">… last 30 days</option>
        </select>
      </div>
      <div class="count" id="acount"></div>
      <div class="list" id="alist"></div>
    </div>

    <!-- SHOWS -->
    <div id="t-shows" hidden>
      <div class="bar">
        <input id="q" type="search" placeholder="Search artist, city, venue…">
        <button class="chip on" data-st="all">All</button>
        <button class="chip" data-st="now">Presale now</button>
        <button class="chip" data-st="onsale">On sale</button>
        <button class="chip" data-st="soon">Coming soon</button>
        <button class="chip" data-st="new">New (48h)</button>
      </div>
      <div class="bar">
        <select id="state" aria-label="State"><option value="">All states</option></select>
        <select id="when" aria-label="Show date">
          <option value="">Any date</option><option value="7">Next 7 days</option><option value="30">Next 30 days</option><option value="90">Next 90 days</option>
        </select>
        <select id="sort" aria-label="Sort shows">
          <option value="heat">Sort: Heat (likely sellout)</option>
          <option value="status">Presales first</option>
          <option value="date">By date</option>
          <option value="draw">By artist draw score</option>
          <option value="new">Newest found</option>
        </select>
        <label><input type="checkbox" id="hideSkip" checked> Hide skipped</label>
        <button class="btn ghost" id="copy">Copy links</button>
      </div>
      <div class="count" id="count"></div>
      <div class="list" id="list"></div>
    </div>

    <!-- MINE -->
    <div id="t-mine" hidden><div id="mineList"></div></div>

    <!-- CHARTS -->
    <div id="t-charts" hidden>
      <div class="bar">
        <select id="chartSel" aria-label="Chart"></select>
        <input id="qc" type="search" placeholder="Filter songs or artists…">
        <label><input type="checkbox" id="cNew"> New entries only</label>
      </div>
      <div class="count" id="ccount"></div>
      <div class="tablewrap"><table><thead><tr>
        <th class="num">#</th><th>Song</th><th>Artist</th><th class="num">Streams</th><th>Move</th><th class="num">On chart</th>
      </tr></thead><tbody id="crows"></tbody></table></div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Artist details"></aside>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CFG = window.TOUR_CONFIG || {};
const DAY = 864e5, NEW_MS = 2*DAY;
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY = () => isoDay(new Date());
const plusDays = n => isoDay(new Date(Date.now() + n*DAY));
const STATUS = {
  "PRESALE NOW":["now","b-now",0], "On sale now":["onsale","b-on",1], "On sale (SeatGeek)":["onsale","b-sg",1],
  "Presale coming":["soon","b-soon",2], "Public on-sale coming":["soon","b-soon",3],
  "Rescheduled":["other","b-off",4], "Unknown":["other","b-off",5], "Off sale / sold out":["other","b-hot",6]
};
const st = s => STATUS[s] || ["other","b-off",9];
const MY = ["Watching","Bought","Listed","Sold","Skip"];

let sb, shows = [], notes = {}, lastRun = null;

/* ---------- formatting ---------- */
function fmtN(n){
  if(n == null) return "–";
  const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"")+"B";
  if(a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/,"")+"M";
  if(a >= 1e3) return Math.round(n/1e3)+"K";
  return String(n);
}
const signed = (n, f = fmtN) => n == null ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + f(Math.abs(n));
const pct = p => p == null ? "–" : (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(p*100).toFixed(Math.abs(p) < .1 ? 1 : 0) + "%";
const cls = n => n == null ? "" : n > 0 ? "up" : n < 0 ? "down" : "";
function ago(t){
  const m = Math.round((Date.now() - new Date(t)) / 6e4);
  if(m < 60) return `${Math.max(m,0)} min ago`; const h = Math.round(m/60);
  if(h < 48) return `${h} hr ago`; return `${Math.round(h/24)} days ago`;
}
function fmtDate(d){
  if(!d) return {m:"TBA",d:"–",w:""};
  const x = new Date(d+"T12:00:00");
  return {m:x.toLocaleString("en-US",{month:"short"}), d:x.getDate(), w:x.toLocaleString("en-US",{weekday:"short"})+" ’"+String(x.getFullYear()).slice(2)};
}
const shortDate = d => d ? new Date(d+"T12:00:00").toLocaleString("en-US",{month:"short",day:"numeric"}) : "";
const when = t => new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":"); const H=+h; return `${(H%12)||12}:${m} ${H<12?"AM":"PM"}`; }
const beforeTracking = t => t && new Date(t).getUTCFullYear() < 2001;
const isNewcomer = (a, days = 7) => a.first_charted && !beforeTracking(a.first_charted) && (Date.now() - new Date(a.first_charted)) < days*DAY;
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1800); }
function show(view){ ["setup","login","app"].forEach(v => $("#v-"+v).hidden = v !== view); }

/* ---------- data ---------- */
async function fetchAll(table, build){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await build(sb.from(table).select("*")).range(from, from+999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}
async function load(){
  $("#sub").textContent = "Loading…";
  try{
    const [s, n, r] = await Promise.all([
      fetchAll("shows", q => q.eq("active", true).or(`date.gte.${TODAY()},date.is.null`).order("date",{ascending:true})),
      fetchAll("notes", q => q),
      sb.from("runs").select("*").order("ran_at",{ascending:false}).limit(1),
    ]);
    shows = s.map(x => ({ ...x, _st: liveStatus(x) })).filter(x => x._st !== "Cancelled");
    notes = Object.fromEntries(n.map(x => [x.key, x]));
    lastRun = (r.data || [])[0] || null;
  }catch(e){
    $("#sub").textContent = "Couldn't load data: " + (e.message || e);
    return;
  }
  const states = [...new Set(shows.map(x => x.state).filter(Boolean))].sort();
  const cur = $("#state").value;
  $("#state").innerHTML = `<option value="">All states</option>` + states.map(x => `<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  renderHeader(); renderShows(); renderMine(); loadChartList();
  if(!load.done){ load.done = true; applyPreset(preset || "draws"); } else queryArtists(true);
}

/* ---------- header ---------- */
async function headCount(build){
  const { count } = await build(sb.from("artists").select("key", { count: "exact", head: true }));
  return count ?? 0;
}
async function renderHeader(){
  $("#sub").textContent = lastRun
    ? `Updated ${ago(lastRun.ran_at)} · ${fmtN(lastRun.artists_tracked)} artists tracked · ${lastRun.charts} Spotify charts · ${lastRun.artists_checked} tours checked · refreshes automatically`
    : "No data yet. If the refresh job has already run, check that your login email is in the allowed_users table.";
  const since7 = new Date(Date.now() - 7*DAY).toISOString();
  const [rising, newc, week] = await Promise.all([
    headCount(q => q.eq("is_rising", true)),
    headCount(q => q.gt("first_charted", since7)),
    headCount(q => q.eq("on_tour", true).gte("next_show_date", TODAY()).lte("next_show_date", plusDays(7))),
  ]);
  const cards = [
    [shows.filter(x => x._st==="PRESALE NOW").length, "presales open now", () => { setTab("shows"); setFilt("now"); }],
    [rising, "rising artists (2–9M)", () => { setTab("discover"); applyPreset("rising"); }],
    [newc, "new on charts this week", () => { setTab("discover"); applyPreset("newcomers"); }],
    [week, "artists playing this week", () => { setTab("discover"); applyPreset("week"); }],
    [shows.length, "upcoming U.S. shows", () => { setTab("shows"); setFilt("all"); }],
  ];
  $("#stats").innerHTML = cards.map(([n,l],i) => `<button class="stat" data-i="${i}"><b>${fmtN(n)}</b><span>${l}</span></button>`).join("");

}

async function queryArtists(reset){
  if(reset){ aPage = 0; aRows = []; $("#alist").innerHTML = `<div class="loading">Loading artists…</div>`; }
  const token = ++aToken;
  const sort = $("#asort").value;
  let q = sb.from("artists").select("*", { count: "exact" });
  const text = $("#aq").value.trim().replace(/[%,()*]/g, " ");
  if(text) q = q.ilike("name", `%${text}%`);
  const lmin = parseFloat($("#lmin").value), lmax = parseFloat($("#lmax").value);
  if(!isNaN(lmin)) q = q.gte("listeners", Math.round(lmin*1e6));
  if(!isNaN(lmax)) q = q.lte("listeners", Math.round(lmax*1e6));
  if($("#fTour").checked) q = q.eq("on_tour", true);
  if($("#fCharts").checked) q = q.eq("in_charts", true);
  if($("#fRising").checked) q = q.eq("is_rising", true);
  if($("#fPresale").checked) q = q.gt("presale_now", 0);
  const w = $("#fWhen").value;
  if(w) q = q.gte("next_show_date", TODAY()).lte("next_show_date", plusDays(+w));
  const nd = $("#fNew").value;
  if(nd) q = q.gt("first_charted", new Date(Date.now() - nd*DAY).toISOString());
  // sort-specific guards so empty values don't crowd the top
  if(sort === "next_show_date") q = q.gte("next_show_date", TODAY());
  if(sort === "us_daily_best") q = q.not("us_daily_best", "is", null);
  if(sort === "first_charted") q = q.gt("first_charted", "2001-01-01");
  if(sort === "growth_30d" || sort === "pct_7d") q = q.not(sort, "is", null);
  const asc = sort === "next_show_date" || sort === "us_daily_best";
  q = q.order(sort, { ascending: asc, nullsFirst: false }).order("listeners", { ascending: false, nullsFirst: false });
  const { data, error, count } = await q.range(aPage*PAGE, aPage*PAGE + PAGE - 1);
  if(token !== aToken) return;
  if(error){ $("#alist").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  aRows = aRows.concat(data);
  const hint = (sort === "growth_30d" || sort === "pct_7d") && !count
    ? " — growth history builds from the first day of tracking; 7-day numbers appear after a week, 30-day after a month. “Growth rate” works from day one." : "";
  $("#acount").textContent = `${(count ?? aRows.length).toLocaleString()} artist${count===1?"":"s"}${hint}`;
  if(!aRows.length){ $("#alist").innerHTML = `<div class="empty">No artists match these filters.</div>`; return; }
  $("#alist").innerHTML = aRows.map((a,i) => artistRow(a, i+1)).join("") +
    ((count ?? 0) > aRows.length ? `<button class="btn plain more" id="amore">Show more</button>` : "");
  const m = $("#amore"); if(m) m.onclick = () => { aPage++; queryArtists(false); };
}

function closeDrawer(){ drawerKey = null; $("#scrim").hidden = true; $("#drawer").hidden = true; document.body.style.overflow = ""; }
function historyChart(h){
  if(h.length < 2) return `<p class="small">History starts building from the first refresh — check back in a few days to see the trend.${h.length ? ` Today: ${fmtN(h[0].listeners)}.` : ""}</p>`;
  const W = 600, H = 170, P = { l: 46, r: 10, t: 10, b: 24 };
  const xs = h.map(r => new Date(r.day+"T12:00:00").getTime()), ys = h.map(r => r.listeners);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), yLo = Math.min(...ys), yHi = Math.max(...ys);
  const pad = (yHi - yLo) * 0.1 || yHi * 0.05, y0 = yLo - pad, y1 = yHi + pad;
  const X = t => P.l + (t - x0) / ((x1 - x0) || 1) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - P.t - P.b);
  const pts = h.map((r,i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
  const ticks = [y0 + (y1-y0)*0.15, (y0+y1)/2, y1 - (y1-y0)*0.15];
  const first = ys[0], last = ys[ys.length-1], ch = (last - first) / first;
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly listeners from ${fmtN(first)} to ${fmtN(last)}">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(v)}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(xs[xs.length-1])}" cy="${Y(last)}" r="3.5" fill="var(--accent)"/>
    <text x="${P.l}" y="${H-6}" font-size="11" fill="var(--muted)">${shortDate(h[0].day)}</text>
    <text x="${W-P.r}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${shortDate(h[h.length-1].day)}</text>
  </svg><p class="help">${fmtN(first)} → ${fmtN(last)} (<span class="${cls(ch)}">${pct(ch)}</span>) over ${Math.round((x1-x0)/DAY)} days</p>`;
}

/* ---------- shows ---------- */
function liveStatus(s){
  const code = (s.status_code || "").toLowerCase();
  if(code === "cancelled" || code === "canceled") return "Cancelled";
  if(code === "offsale") return "Off sale / sold out";
  const w = s.presale_windows || [], now = Date.now();
  if(!w.length && !s.onsale_at) return s.sale_status;
  if(w.some(p => new Date(p.start) <= now && now <= new Date(p.end))) return "PRESALE NOW";
  if(s.onsale_at && new Date(s.onsale_at) <= now) return "On sale now";
  if(w.some(p => new Date(p.start) > now)) return "Presale coming";
  if(s.onsale_at && new Date(s.onsale_at) > now) return "Public on-sale coming";
  return s.sale_status;
}
function presaleText(s){
  const w = s.presale_windows || [], now = Date.now();
  const open = w.filter(p => new Date(p.start) <= now && now <= new Date(p.end));
  const next = w.filter(p => new Date(p.start) > now).sort((a,b) => new Date(a.start) - new Date(b.start));
  const parts = [];
  if(open.length) parts.push(`Open: ${open.map(p => `${esc(p.name)} (ends ${when(p.end)})`).join("; ")}`);
  if(next.length) parts.push(`Next: ${esc(next[0].name)} ${when(next[0].start)}${next.length > 1 ? ` +${next.length-1} more` : ""}`);
  if(s.onsale_at && new Date(s.onsale_at) > now) parts.push(`Public on-sale ${when(s.onsale_at)}`);
  if(!parts.length && !w.length){
    if(s.presales_now) parts.push(`Open: ${esc(s.presales_now)}`);
    else if(s.presales_upcoming) parts.push(`Next: ${esc(s.presales_upcoming)}`);
  }
  return parts.map(t => `<span class="small">${t}</span>`).join("");
}
function price(s){
  const a = s.price_min, b = s.price_max;
  if(a==null && b==null) return "";
  if(a!=null && b!=null && +a !== +b) return `$${Math.round(a)}–$${Math.round(b)}`;
  return `from $${Math.round(a ?? b)}`;
}
function heatSignals(s){
  const p = s.heat_parts || {}, out = [];
  if(p.resale_x) out.push(`resale ${p.resale_x}× face`);
  else if(s.resale_low) out.push(`resale from $${Math.round(s.resale_low)}`);
  if(s.verified_fan) out.push("Verified Fan sale");
  if(p.seatgeek != null) out.push(`SeatGeek demand ${p.seatgeek}`);
  if(s.resale_listings != null) out.push(`${s.resale_listings} resale listings`);
  return out.join(" · ");
}

    </div>` : "";
  return `<div class="show${n && n.status==="Skip" ? " skip":""}" data-card="${esc(s.id)}">
    <div class="show-main">
      <div class="date"><div class="m">${d.m}</div><div class="d">${d.d}</div><div class="w">${d.w}</div></div>
      <div style="min-width:0">
        <div class="who"><button data-artist="${esc(s.artist_key)}">${esc(s.artist)}</button><span class="rk">${s.listeners ? fmtN(s.listeners)+" listeners" : ""}${s.draw_score ? ` · draw ${Math.round(s.draw_score)}` : ""}</span></div>
        <div class="where">${esc(s.venue)} · ${esc(s.city)}${s.state?", "+esc(s.state):""}${s.time?" · "+fmtTime(s.time):""}</div>
        <div class="meta">
          <span class="badge ${bc}">${esc(s._st)}</span>
          ${isNew ? `<span class="badge b-new">NEW</span>` : ""}
          ${n && n.status && n.status!=="Skip" ? `<span class="badge b-mine">${esc(n.status)}</span>` : ""}
          ${price(s) ? `<span class="small">${price(s)}</span>` : ""}${presaleText(s)}
        </div>
        ${sig ? `<div class="small" style="margin-top:4px">${esc(sig)}</div>` : ""}
        ${n && n.note && openEditor !== s.id ? `<div class="notepeek">${esc(n.note)}</div>` : ""}
      </div>
      <span class="ring hot" style="--v:${s.heat_score||0}" title="Heat: how likely this show is to sell out"><b>${Math.round(s.heat_score||0)}</b></span>
      <div class="links">${links}</div>
    </div>${ed}
  </div>`;
}
let filt = "all", limit = 150, visibleLinks = [];
function filteredShows(){
  const q = $("#q").value.trim().toLowerCase(), state = $("#state").value, sort = $("#sort").value, w = $("#when").value;
  let rows = shows.slice();
  if(filt === "new") rows = rows.filter(s => s.first_seen && (Date.now() - new Date(s.first_seen)) < NEW_MS);
  else if(filt !== "all") rows = rows.filter(s => st(s._st)[0] === filt);
  if(state) rows = rows.filter(s => s.state === state);
  if(w) rows = rows.filter(s => s.date && s.date <= plusDays(+w));
  if($("#hideSkip").checked) rows = rows.filter(s => (notes["show:"+s.id]||{}).status !== "Skip");
  if(q) rows = rows.filter(s => [s.artist,s.city,s.venue,s.event,s.state,(notes["show:"+s.id]||{}).note].join(" ").toLowerCase().includes(q));
  const byDate = (a,b) => (a.date||"9999").localeCompare(b.date||"9999");
  rows.sort(sort==="date" ? byDate
    : sort==="draw" ? (a,b) => (b.draw_score||0)-(a.draw_score||0) || byDate(a,b)
    : sort==="new" ? (a,b) => (b.first_seen||"").localeCompare(a.first_seen||"") || byDate(a,b)
    : sort==="status" ? (a,b) => st(a._st)[2]-st(b._st)[2] || (b.heat_score||0)-(a.heat_score||0) || byDate(a,b)
    : (a,b) => (b.heat_score||0)-(a.heat_score||0) || byDate(a,b));
  return rows;
}
function renderShows(){
  const rows = filteredShows();
  visibleLinks = rows.map(s => s.ticket_url || s.seatgeek_url).filter(Boolean);
  $("#count").textContent = `${rows.length} show${rows.length===1?"":"s"}`;
  if(!rows.length){ $("#list").innerHTML = `<div class="empty">${shows.length ? "No shows match these filters." : "No shows yet. They appear after a refresh with a Ticketmaster or SeatGeek key."}</div>`; return; }
  $("#list").innerHTML = rows.slice(0, limit).map(card).join("") +
    (rows.length > limit ? `<button class="btn plain more" id="more">Show more (${rows.length-limit} left)</button>` : "");
  const more = $("#more"); if(more) more.onclick = () => { limit += 150; renderShows(); };
}
function setFilt(v){ filt = v; limit = 150; $$("[data-st]").forEach(x => x.classList.toggle("on", x.dataset.st===v)); renderShows(); }

/* ---------- my list ---------- */
async function renderMine(){
  const mine = shows.filter(s => { const n = notes["show:"+s.id]; return n && (n.status || n.note); });
  const artKeys = Object.values(notes).filter(n => n.key.startsWith("artist:") && (n.status || n.note)).map(n => n.key.slice(7));
  $("#mineN").textContent = (mine.length + artKeys.length) || "";
  let html = "";
  if(artKeys.length){
    const { data } = await sb.from("artists").select("*").in("key", artKeys.slice(0, 300));
    const arts = (data || []).sort((a,b) => (b.draw_score||0) - (a.draw_score||0));
    html += `<div class="group-h">Artists · ${arts.length}</div><div class="list">${arts.map((a,i) => artistRow(a, i+1)).join("")}</div>`;
  }
  const order = ["Watching","Bought","Listed","Sold","","Skip"], groups = {};
  mine.forEach(s => { const k = notes["show:"+s.id].status || ""; (groups[k] ||= []).push(s); });
  html += order.filter(k => groups[k]).map(k =>
    `<div class="group-h">${k ? k+" shows" : "Shows with notes"} · ${groups[k].length}</div><div class="list">${groups[k].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(card).join("")}</div>`).join("");
  $("#mineList").innerHTML = html || `<div class="empty">Star artists (★ Watching) or mark shows as Watching / Bought / Listed / Sold and they'll collect here.</div>`;
}

/* ---------- charts ---------- */
async function loadChartList(){
  const { data, error } = await sb.from("chart_entries").select("chart,chart_code,period,chart_date").eq("pos", 1).order("chart");
  if(error || !data) return;
  const pri = c => c.chart_code==="global" ? 0 : c.chart_code==="us" ? 1 : 2;
  const list = data.sort((a,b) => pri(a)-pri(b) || a.chart.localeCompare(b.chart) || a.period.localeCompare(b.period));
  const cur = $("#chartSel").value || "us_weekly";
  $("#chartSel").innerHTML = list.map(c => { const v = c.chart_code+"_"+c.period;
    return `<option value="${v}"${v===cur?" selected":""}>${esc(c.chart)} — ${c.period==="weekly"?"Weekly":"Daily"}</option>`; }).join("");
  loadChart();
}
let chartRows = [];
async function loadChart(){
  const v = $("#chartSel").value; if(!v) return;
  const i = v.lastIndexOf("_"), code = v.slice(0,i), period = v.slice(i+1);
  $("#crows").innerHTML = `<tr><td colspan="6" class="small">Loading…</td></tr>`;
  const { data, error } = await sb.from("chart_entries").select("*").eq("chart_code", code).eq("period", period).order("pos").limit(200);
  if(error){ $("#crows").innerHTML = `<tr><td colspan="6">${esc(error.message)}</td></tr>`; return; }
  chartRows = data; renderChart();
}
function renderChart(){
  const q = $("#qc").value.trim().toLowerCase(), onlyNew = $("#cNew").checked;
  const rows = chartRows.filter(r => (!q || [r.title,r.artist,r.featured].join(" ").toLowerCase().includes(q)) && (!onlyNew || r.change === "NEW" || r.change === "RE"));
  const c = chartRows[0];
  $("#ccount").textContent = c ? `${rows.length} songs · chart date ${c.chart_date || "?"} · click an artist for details` : "";
  $("#crows").innerHTML = rows.map(r => `<tr>
    <td class="num">${r.pos}</td>
    <td>${r.track_url ? `<a href="${esc(r.track_url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title)}</td>
    <td><button class="alink" data-artist="${esc(r.artist_key)}">${esc(r.artist)}</button>${r.featured ? `<span class="small"> w/ ${esc(r.featured)}</span>` : ""}</td>
    <td class="num">${r.streams != null ? Number(r.streams).toLocaleString() : ""}</td>
    <td>${r.change === "NEW" ? `<span class="badge b-new">NEW</span>` : esc(r.change || "")}</td>
    <td class="num">${r.days != null ? r.days+"d" : r.weeks != null ? r.weeks+"w" : ""}</td>
  </tr>`).join("") || `<tr><td colspan="6" class="small">No songs.</td></tr>`;
}

/* ---------- notes ---------- */
const pending = {};
async function saveNote(key, patch){
  const next = { ...(notes[key] || {}), ...patch, key, updated_at: new Date().toISOString() };
  notes[key] = next;
  const { error } = await sb.from("notes").upsert({ key, status: next.status || null, note: next.note || null, updated_at: next.updated_at });
  if(error){ toast("Couldn't save: " + error.message); return false; }
  return true;
}
function rerenderCard(id){
  const s = shows.find(x => x.id === id); if(!s) return;
  $$(`[data-card="${CSS.escape(id)}"]`).forEach(el => { el.outerHTML = card(s); });
}
function updateMineCount(){
  const a = Object.values(notes).filter(n => n.status || n.note).length;
  $("#mineN").textContent = a || "";
}

/* ---------- tabs ---------- */
function setTab(t){
  $$(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab===t));
  ["discover","shows","mine","charts"].forEach(v => $("#t-"+v).hidden = v !== t);
  if(t === "mine") renderMine();
  try{ localStorage.setItem("tf-tab", t); }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if(e.target.closest("[data-close]") || e.target === $("#scrim")){ closeDrawer(); return; }
  const pr = e.target.closest("[data-preset]"); if(pr){ applyPreset(pr.dataset.preset); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ const id = ed.dataset.edit, prev = openEditor; openEditor = openEditor === id ? null : id;
    if(prev && prev !== id) rerenderCard(prev); rerenderCard(id);
    if(openEditor){ const ta = document.querySelector(`[data-note="${CSS.escape(id)}"]`); if(ta) ta.focus(); }
    return; }
  const pill = e.target.closest("[data-pill]");
  if(pill){ const id = pill.dataset.id, key = "show:"+id, cur = (notes[key]||{}).status;
    const ta = document.querySelector(`[data-note="${CSS.escape(id)}"]`);
    const patch = { status: cur === pill.dataset.pill ? null : pill.dataset.pill };
    if(ta) patch.note = ta.value;
    if(await saveNote(key, patch)){ rerenderCard(id); updateMineCount(); toast(patch.status ? `Marked ${patch.status}` : "Status cleared"); }
    return; }
  const star = e.target.closest("[data-astar]");
  if(star){ const key = "artist:"+star.dataset.astar, on = (notes[key]||{}).status !== "Watching";
    const ta = document.querySelector(`[data-anote="${CSS.escape(star.dataset.astar)}"]`);
    if(await saveNote(key, { status: on ? "Watching" : null, note: ta ? ta.value : (notes[key]||{}).note })){
      star.classList.toggle("on", on); updateMineCount(); toast(on ? "Watching this artist" : "Removed from watch list"); }
    return; }
  const art = e.target.closest("[data-artist]");
  if(art && art.dataset.artist){ e.preventDefault(); openArtist(art.dataset.artist); return; }
});
document.addEventListener("input", e => {
  const ta = e.target.closest("[data-note]");
  if(ta){ const id = ta.dataset.note, key = "show:"+id;
    const lab = document.querySelector(`[data-saved="${CSS.escape(id)}"]`); if(lab) lab.textContent = "Saving…";
    clearTimeout(pending[key]);
    pending[key] = setTimeout(async () => { if(await saveNote(key, { note: ta.value }) && lab) lab.textContent = "Saved"; updateMineCount(); }, 700);
    return; }
  const an = e.target.closest("[data-anote]");
  if(an){ const key = "artist:"+an.dataset.anote; const lab = $("#asaved"); if(lab) lab.textContent = "Saving…";
    clearTimeout(pending[key]);
    pending[key] = setTimeout(async () => { if(await saveNote(key, { note: an.value }) && lab) lab.textContent = "Saved"; updateMineCount(); }, 800); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && drawerKey) closeDrawer(); });

let aDeb;
$("#aq").addEventListener("input", () => { clearTimeout(aDeb); aDeb = setTimeout(customized, 300); });
["#lmin","#lmax"].forEach(id => $(id).addEventListener("input", () => { clearTimeout(aDeb); aDeb = setTimeout(customized, 400); }));
["#asort","#fTour","#fCharts","#fRising","#fPresale","#fWhen","#fNew"].forEach(id => $(id).addEventListener("change", customized));
$$("[data-st]").forEach(b => b.onclick = () => setFilt(b.dataset.st));
$$(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
["#q","#state","#sort","#hideSkip","#when"].forEach(id => $(id).addEventListener("input", () => { limit = 150; renderShows(); }));
$("#qc").addEventListener("input", renderChart);
$("#cNew").addEventListener("change", renderChart);
$("#chartSel").addEventListener("change", loadChart);
$("#reload").onclick = load;
$("#copy").onclick = async () => {
  const txt = visibleLinks.join("\n");
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(`Copied ${visibleLinks.length} links`);
};
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pw").value });
  if(error) $("#loginErr").textContent = error.message;
};
$("#signout").onclick = () => sb.auth.signOut();

// keep "presale now" accurate between refreshes
setInterval(() => {
  let changed = false;
  shows.forEach(x => { const v = liveStatus(x); if(v !== x._st){ x._st = v; changed = true; } });
  if(changed && !openEditor) renderShows();
}, 60000);

(function start(){
  if(!CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("PASTE") || !window.supabase){ show("setup"); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  renderPresets();
  try{ const t = localStorage.getItem("tf-tab"); if(t && $("#t-"+t)) setTab(t); }catch(e){}
  let started = false;
  sb.auth.onAuthStateChange((_ev, session) => {
    if(session){ show("app"); if(!started){ started = true; load(); } }
    else { started = false; show("login"); }
  });
})();
</script>
</body>
